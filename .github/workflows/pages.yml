# Публикует статическую версию сайта на GitHub Pages при каждом изменении в main.
# Один раз включите: Settings → Pages → Build and deployment → Source: «GitHub Actions».
# На бесплатном тарифе GitHub Pages работает только для публичных репозиториев —
# для приватного шаг пропускается (используйте Netlify, см. netlify.toml).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build:static
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
